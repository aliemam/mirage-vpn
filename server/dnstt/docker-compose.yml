services:
  dnstt:
    build: .
    container_name: dnstt-server
    restart: unless-stopped
    network_mode: host
    cap_add:
      - NET_ADMIN
    environment:
      - DNSTT_DOMAIN=${DNSTT_DOMAIN:-d1.yourdomain.com}
    volumes:
      - ./keys:/keys
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
